<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgClix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgClix)"/>

  <!-- photo grid -->
  <g>
    <rect x="120" y="90" width="130" height="130" rx="6" fill="#3498db" opacity="0.85"/>
    <rect x="262" y="90" width="130" height="130" rx="6" fill="#d16004" opacity="0.85"/>
    <rect x="120" y="232" width="130" height="130" rx="6" fill="#d16004" opacity="0.55"/>
    <rect x="262" y="232" width="130" height="130" rx="6" fill="#3498db" opacity="0.55"/>

    <!-- face-cluster boxes on two of the tiles -->
    <rect x="150" y="120" width="45" height="45" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="300" y="260" width="45" height="45" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <line x1="172" y1="142" x2="322" y2="282" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
  </g>

  <!-- search / magnifier over the grid -->
  <g transform="translate(430,230)">
    <circle cx="70" cy="70" r="60" fill="none" stroke="#ffffff" stroke-width="8"/>
    <line x1="112" y1="112" x2="160" y2="160" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="70" r="60" fill="#0f172a" opacity="0.15"/>
  </g>

  <!-- vector dots inside magnifier suggesting embedding search -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="470" cy="270" r="4"/>
    <circle cx="495" cy="290" r="4"/>
    <circle cx="460" cy="310" r="4"/>
    <circle cx="500" cy="320" r="4"/>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff" text-transform="uppercase">CLIX</text>
  <text x="400" y="468" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="13" letter-spacing="3" fill="#d16004">LOCAL-FIRST AI PHOTO SEARCH · CLIP + FAISS</text>
</svg>
