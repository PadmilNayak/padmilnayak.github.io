<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgRS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20303f"/>
      <stop offset="100%" stop-color="#111c26"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgRS)"/>

  <!-- users column -->
  <g fill="#3498db">
    <circle cx="150" cy="150" r="16"/>
    <circle cx="150" cy="250" r="16"/>
    <circle cx="150" cy="350" r="16"/>
  </g>
  <!-- items column -->
  <g fill="#d16004">
    <rect x="600" y="120" width="60" height="42" rx="5"/>
    <rect x="600" y="200" width="60" height="42" rx="5"/>
    <rect x="600" y="280" width="60" height="42" rx="5"/>
    <rect x="600" y="360" width="60" height="42" rx="5"/>
  </g>

  <!-- collaborative filtering connections -->
  <g stroke="#ffffff" stroke-width="1.3" opacity="0.35">
    <line x1="166" y1="150" x2="600" y2="141"/>
    <line x1="166" y1="150" x2="600" y2="221"/>
    <line x1="166" y1="250" x2="600" y2="141"/>
    <line x1="166" y1="250" x2="600" y2="301"/>
    <line x1="166" y1="350" x2="600" y2="221"/>
    <line x1="166" y1="350" x2="600" y2="381"/>
  </g>

  <!-- hybrid model node in the middle -->
  <g transform="translate(340,200)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#ffffff" opacity="0.08" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
    <text x="70" y="40" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif" font-size="13" fill="#ffffff" letter-spacing="1">HYBRID</text>
    <text x="70" y="60" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif" font-size="13" fill="#ffffff" letter-spacing="1">MODEL</text>
    <g fill="#d16004">
      <polygon points="55,75 58,82 65,83 59,88 61,95 55,91 49,95 51,88 45,83 52,82"/>
      <polygon points="85,75 88,82 95,83 89,88 91,95 85,91 79,95 81,88 75,83 82,82"/>
    </g>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="30" font-weight="900" letter-spacing="3" fill="#ffffff" text-transform="uppercase">HYBRID RECOMMENDER</text>
  <text x="400" y="468" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="13" letter-spacing="3" fill="#3498db">COLLABORATIVE + CONTENT-BASED FILTERING</text>
</svg>
