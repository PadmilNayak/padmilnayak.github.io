<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgC" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2c3e50"/>
      <stop offset="100%" stop-color="#1b2733"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgC)"/>

  <!-- network / graph nodes representing vector retrieval -->
  <g stroke="#3498db" stroke-width="1.5" opacity="0.45">
    <line x1="120" y1="120" x2="250" y2="90"/>
    <line x1="120" y1="120" x2="200" y2="210"/>
    <line x1="250" y1="90" x2="340" y2="150"/>
    <line x1="200" y1="210" x2="340" y2="150"/>
    <line x1="340" y1="150" x2="440" y2="110"/>
    <line x1="120" y1="380" x2="230" y2="420"/>
    <line x1="230" y1="420" x2="330" y2="380"/>
    <line x1="600" y1="380" x2="690" y2="420"/>
    <line x1="600" y1="380" x2="650" y2="300"/>
  </g>
  <g fill="#3498db">
    <circle cx="120" cy="120" r="5" opacity="0.8"/>
    <circle cx="250" cy="90" r="4" opacity="0.6"/>
    <circle cx="200" cy="210" r="4" opacity="0.6"/>
    <circle cx="340" cy="150" r="5" opacity="0.8"/>
    <circle cx="440" cy="110" r="4" opacity="0.6"/>
    <circle cx="120" cy="380" r="4" opacity="0.6"/>
    <circle cx="230" cy="420" r="4" opacity="0.6"/>
    <circle cx="330" cy="380" r="4" opacity="0.6"/>
    <circle cx="600" cy="380" r="4" opacity="0.6"/>
    <circle cx="690" cy="420" r="4" opacity="0.6"/>
    <circle cx="650" cy="300" r="4" opacity="0.6"/>
  </g>

  <!-- play / video icon -->
  <g transform="translate(300,175)">
    <rect x="0" y="0" width="200" height="130" rx="10" fill="#ffffff" opacity="0.06"/>
    <rect x="0" y="0" width="200" height="130" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="100" cy="65" r="34" fill="#d16004"/>
    <polygon points="90,48 90,82 122,65" fill="#ffffff"/>
  </g>

  <!-- chat / citation bubble -->
  <g transform="translate(470,60)">
    <rect x="0" y="0" width="230" height="110" rx="14" fill="#ffffff"/>
    <polygon points="30,110 30,135 60,110" fill="#ffffff"/>
    <rect x="22" y="24" width="186" height="10" rx="5" fill="#d0d7de"/>
    <rect x="22" y="46" width="150" height="10" rx="5" fill="#d0d7de"/>
    <rect x="22" y="68" width="170" height="10" rx="5" fill="#d0d7de"/>
    <rect x="22" y="86" width="80" height="14" rx="7" fill="#d16004"/>
    <text x="30" y="97" font-family="Courier New, monospace" font-size="10" fill="#ffffff">0:42</text>
  </g>

  <text x="400" y="450" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff" text-transform="uppercase">CORTEX</text>
  <text x="400" y="478" text-anchor="middle" font-family="Raleway, Helvetica, sans-serif"
        font-size="13" letter-spacing="3" fill="#3498db">AI VIDEO KNOWLEDGE ASSISTANT · RAG</text>
</svg>
